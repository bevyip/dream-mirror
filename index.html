<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Dream Mirror</title>
</head>

<body>
  <div id="app"></div>
  <script id="vertexshader" type="vertex">
    uniform float uTime;
    uniform float uFrequency; // Audio frequency (0-255, similar to example)
    uniform float uValence; // Valence for morphing speed control
    
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    // Classic Perlin noise functions (from example)
    vec3 mod289(vec3 x) {
      return x - floor(x * (1.0 / 289.0)) * 289.0;
    }
    
    vec4 mod289(vec4 x) {
      return x - floor(x * (1.0 / 289.0)) * 289.0;
    }
    
    vec4 permute(vec4 x) {
      return mod289(((x*34.0)+10.0)*x);
    }
    
    vec4 taylorInvSqrt(vec4 r) {
      return 1.79284291400159 - 0.85373472095314 * r;
    }
    
    vec3 fade(vec3 t) {
      return t*t*t*(t*(t*6.0-15.0)+10.0);
    }

    // Classic Perlin noise, periodic variant
    float pnoise(vec3 P, vec3 rep) {
      vec3 Pi0 = mod(floor(P), rep); // Integer part, modulo period
      vec3 Pi1 = mod(Pi0 + vec3(1.0), rep); // Integer part + 1, mod period
      Pi0 = mod289(Pi0);
      Pi1 = mod289(Pi1);
      vec3 Pf0 = fract(P); // Fractional part for interpolation
      vec3 Pf1 = Pf0 - vec3(1.0); // Fractional part - 1.0
      vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
      vec4 iy = vec4(Pi0.yy, Pi1.yy);
      vec4 iz0 = Pi0.zzzz;
      vec4 iz1 = Pi1.zzzz;

      vec4 ixy = permute(permute(ix) + iy);
      vec4 ixy0 = permute(ixy + iz0);
      vec4 ixy1 = permute(ixy + iz1);

      vec4 gx0 = ixy0 * (1.0 / 7.0);
      vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
      gx0 = fract(gx0);
      vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
      vec4 sz0 = step(gz0, vec4(0.0));
      gx0 -= sz0 * (step(0.0, gx0) - 0.5);
      gy0 -= sz0 * (step(0.0, gy0) - 0.5);

      vec4 gx1 = ixy1 * (1.0 / 7.0);
      vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
      gx1 = fract(gx1);
      vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
      vec4 sz1 = step(gz1, vec4(0.0));
      gx1 -= sz1 * (step(0.0, gx1) - 0.5);
      gy1 -= sz1 * (step(0.0, gy1) - 0.5);

      vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
      vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
      vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
      vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
      vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
      vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
      vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
      vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

      vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
      g000 *= norm0.x;
      g010 *= norm0.y;
      g100 *= norm0.z;
      g110 *= norm0.w;
      vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
      g001 *= norm1.x;
      g011 *= norm1.y;
      g101 *= norm1.z;
      g111 *= norm1.w;

      float n000 = dot(g000, Pf0);
      float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
      float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
      float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
      float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
      float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
      float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
      float n111 = dot(g111, Pf1);

      vec3 fade_xyz = fade(Pf0);
      vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
      vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
      float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x); 
      return 2.2 * n_xyz;
    }
    
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = position;
      
      // Create morphing effect using classic Perlin noise (similar to audio-responsive blob)
      vec3 pos = position;
      
      // Calculate valence-based adjustments
      // Negative emotions (low valence) = more active deformation
      // Positive emotions (high valence) = calmer deformation
      float normalizedValence = (uValence + 1.0) * 0.5; // Convert -1 to +1 → 0 to 1
      
      // Adjust noise scale based on valence: negative = more detailed noise
      // HIGHER noise scale = finer detail = thinner spikes
      float noiseScale = mix(15.0, 12.0, normalizedValence); // Increased for finer detail/thinner spikes (was 10.0, 8.0)
      
      // Create flowing animation with time (like the example: position + u_time)
      // Speed can vary slightly with valence
      float timeSpeed = mix(1.2, 0.8, normalizedValence);
      
      // MULTI-LAYER NOISE for more variance in spike patterns
      // Layer 1: Base noise for primary spikes
      float noise1 = 2.0 * pnoise(position + uTime * timeSpeed, vec3(noiseScale));
      
      // Layer 2: Higher frequency noise for varied spike patterns
      float noise2 = 1.5 * pnoise(position * 1.7 + uTime * timeSpeed * 1.3, vec3(noiseScale * 1.5));
      
      // Layer 3: Lower frequency noise for broader variation zones
      float noise3 = 1.0 * pnoise(position * 0.6 + uTime * timeSpeed * 0.7, vec3(noiseScale * 0.7));
      
      // Combine layers with varied influence - creates more diverse spike patterns
      // Use different mixing to create variance: some areas have stronger spikes, others weaker
      float noiseVariation = abs(noise1) * 0.6 + abs(noise2) * 0.3 + abs(noise3) * 0.1;
      
      // Add position-based variation - different parts of orb react differently
      float positionVariation = sin(dot(position, normalize(vec3(1.0, 2.0, 0.5))) * 2.0 + uTime) * 0.3 + 0.7;
      
      // Combine noise with position variation for more variance
      float noise = noise1 * positionVariation + noise2 * (1.0 - positionVariation * 0.5);
      
      // VALENCE-BASED SPIKE BEHAVIOR
      // Negative emotions = longer, more varied spikes with more displacement
      // Positive emotions = more stable, less displacement
      
      // Valence controls spike intensity: negative = more extreme, positive = more stable
      // Convert valence (-1 to 1) to spike intensity multiplier (2.5 for negative, 0.5 for positive)
      float spikeIntensityMultiplier = mix(2.5, 0.5, normalizedValence); // Negative=2.5x, Positive=0.5x
      
      // Valence controls variance: negative = more varied, positive = more uniform
      // Negative emotions get much more variance in spike lengths
      float varianceRange = mix(3.5, 1.2, normalizedValence); // Negative=more variance (0.5-4.0), Positive=less (1.0-1.2)
      float displacementMultiplier = mix(0.5, varianceRange, noiseVariation) * spikeIntensityMultiplier;
      
      // Valence controls spike extension: negative = longer spikes, positive = shorter
      // Divisors control extension: smaller = longer spikes
      float extensionDivisor1 = mix(25.0, 40.0, normalizedValence); // Negative=smaller divisor=longer, Positive=larger=shorter
      float extensionDivisor2 = mix(10.0, 20.0, normalizedValence); // Same for second divisor
      
      float audioDisplacement = (uFrequency / extensionDivisor1) * (noise / extensionDivisor2) * displacementMultiplier;
      
      // VERY minimal base displacement - only for subtle, flowy movement when calm
      // This should be barely perceptible - just enough to keep it alive
      // Use combined noise for base displacement too
      float baseDisplacement = noise1 * 0.005; // Even smaller - almost imperceptible when quiet
      
      // Add valence-based intensity multiplier for emotion control
      // But keep base displacement very subtle for calm state
      float valenceIntensity = mix(1.2, 0.4, normalizedValence);
      
      // Sharp distinction: audio spikes are abrupt and dominate
      // Base displacement is minimal - creates clear contrast
      // When uFrequency is high, audioDisplacement dominates (spiky)
      // When uFrequency is low, only tiny baseDisplacement shows (smooth, flowy)
      float displacement = audioDisplacement + baseDisplacement * valenceIntensity * 0.5;
      
      // Apply deformation along normal (edges poke out when audio/noise is detected)
      vec3 newPosition = position + normal * displacement;
      
      // Store deformed position for fragment shader
      vPosition = newPosition;
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
  </script>
  <script id="fragmentshader" type="fragment">
    uniform vec3 uColor;
    uniform float uTime;
    uniform float uValence; // -1 (negative/complex) to 1 (positive/simple)
    
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    void main() {
      float r = length(vPosition);
      float depth = r;
      float time1 = uTime * 0.6;
      float time2 = uTime * 0.8;
      float time3 = uTime * 0.7;
      
      // Wave complexity based on valence (controlled by scrollbar)
      float complexity = 0.25 + (1.0 - uValence) * 0.375; // Range: 1.0 to 0.25
      float frequencyMultiplier = 0.4 + complexity * 0.6;
      float patternMix = 0.3 + complexity * 0.7;
      
      // Simple wave patterns (no convergence points)
      vec3 dir1 = normalize(vec3(1.0, 2.0, 0.5));
      vec3 dir2 = normalize(vec3(0.5, 1.0, 2.0));
      vec3 dir3 = normalize(vec3(2.0, 0.5, 1.0));
      vec3 dir4 = normalize(vec3(-1.0, 1.5, 1.0));
      vec3 dir5 = normalize(vec3(1.5, -1.0, 1.5));
      
      float wave1 = sin(dot(vPosition, dir1) * (2.5 * frequencyMultiplier) + time1 * 1.5);
      float wave2 = sin(dot(vPosition, dir2) * (3.5 * frequencyMultiplier) + time2 * 1.2);
      float wave3 = sin(dot(vPosition, dir3) * (4.0 * frequencyMultiplier) + time3 * 1.8);
      float wave4 = sin(dot(vPosition, dir4) * (5.5 * frequencyMultiplier) + time1 * 2.0) * patternMix;
      float wave5 = sin(dot(vPosition, dir5) * (4.5 * frequencyMultiplier) + time2 * 1.5) * patternMix * 0.8;
      
      vec3 swirlDir1 = normalize(cross(dir1, dir2));
      vec3 swirlDir2 = normalize(cross(dir3, dir4));
      float swirl1 = sin(dot(vPosition, swirlDir1) * (6.0 * frequencyMultiplier) + time1 * 2.0) * patternMix * 0.7;
      float swirl2 = sin(dot(vPosition, swirlDir2) * (5.0 * frequencyMultiplier) + time2 * 1.8) * patternMix * 0.5;
      
      float variation = sin(dot(vPosition, normalize(dir1 + dir3)) * 1.5 + time3 * 0.8) * 0.3 + 0.7;
      float energyLines = (wave1 * 0.3 + wave2 * 0.3 + wave3 * 0.25 + wave4 * 0.1 + wave5 * 0.05) * variation;
      float swirlPattern = (swirl1 + swirl2) * 0.5 * variation;
      
      float lineIntensity = pow(abs(energyLines), 0.4);
      float swirlIntensity = pow(abs(swirlPattern), 0.5) * 0.7;
      float lineWeight = 0.5 + (1.0 - complexity) * 0.4;
      float swirlWeight = 0.5 - (1.0 - complexity) * 0.4;
      float energyIntensity = (lineIntensity * lineWeight + swirlIntensity * swirlWeight);
      energyIntensity = pow(energyIntensity, 0.6) * 1.5;
      energyIntensity = clamp(energyIntensity, 0.0, 1.0);
      
      float innerSurface = smoothstep(0.7, 0.95, depth) * (1.0 - smoothstep(0.95, 1.0, depth));
      energyIntensity *= innerSurface * 0.8 + 0.2;
      
      // SIMPLE LIGHTING: Uniform 360-degree illumination
      // Simple uniform inner light (no view dependency)
      float normalizedDepth = clamp(depth, 0.0, 1.0);
      float innerGlow = 1.0 - smoothstep(0.0, 0.85, normalizedDepth);
      innerGlow = pow(innerGlow, 1.2); // Softer falloff for brighter inner light
      
      // Valence-based color - preserve saturation by using color instead of white mixing
      vec3 innerLight = uColor * 4.0; // Use pure color for inner light (no white desaturation)
      vec3 baseColor = uColor * 1.2; // Strong base color to maintain saturation
      
      // White energy lines - keep pure white for contrast (these should stay white)
      float energyMask = smoothstep(0.12, 0.75, energyIntensity);
      vec3 whiteEnergy = vec3(1.0, 1.0, 1.0) * energyMask * (5.0 + energyIntensity * 4.0);
      
      // Final color: saturated color with white energy overlay
      vec3 finalColor = baseColor * 0.8; // Strong saturated base color
      finalColor += innerLight * innerGlow * 2.5; // Saturated inner light (no white mixing)
      finalColor += whiteEnergy * 2.2; // Bright white energy lines (keep separate)
      finalColor += baseColor * 0.6; // Additional saturated base color
      
      // Ensure valid color range
      finalColor = clamp(finalColor, 0.0, 10.0);
      
      // Transparent but visible - increased alpha for visibility
      float distanceFromCenter = length(vPosition);
      float alpha = 0.2 + (1.0 - normalizedDepth) * 0.2 + energyIntensity * 0.2; // Higher base for visibility
      alpha = clamp(alpha, 0.2, 0.5); // 20-50% opacity (visible but still transparent)
      
      gl_FragColor = vec4(finalColor, alpha);
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
